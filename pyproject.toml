[project]
name = "peermesh"
version = "0.1.0"
description = "Local peer messaging between Claude Code and Codex sessions"
requires-python = ">=3.11"
dependencies = ["mcp>=2.2,<3"]

[project.scripts]
peers = "peermesh.cli:main"
peers-mcp = "peermesh.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peermesh"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
markers = [
  "live: spends model turns; runs only with PEERMESH_LIVE=1",
  "contract: runs real local binaries; spends nothing",
]
addopts = "-m 'not live'"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
